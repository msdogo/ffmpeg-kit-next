# =============================================================================
#  用 GitHub Actions 编译「改名版」FFmpegKitNext for Android
#
#  - 只编译 arm64-v8a（arm v8）
#  - 启用全部外部库（--enable-lib-all --enable-gpl）
#  - 把 ffmpeg 的 libavcodec.so / libavformat.so … 和 ffmpeg-kit 包装库整体改名，
#    避免与 DJI SDK 自带的 ffmpeg 动态库在同一个 APK 里重名冲突
#  - 产出：release AAR + 本地 Maven 仓库 + 单独的 .so 包
#
#  用法：把这个文件和 tools/rebrand/ 一起提交到你的 fork，
#        在 Actions 页面手动触发 workflow 即可。
# =============================================================================

name: Android arm64-v8a (rebranded)

on:
  workflow_dispatch:
    inputs:
      build_opts:
        description: "覆盖默认构建参数（留空则用 env.BUILD_OPTS）"
        required: false
        type: string
        default: ""
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/android-arm64-rebrand.yml"
      - "tools/rebrand/**"

permissions:
  contents: read

concurrency:
  group: ffmpeg-android-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  # -------------------------------------------------------------------------
  # 工具链版本（与上游 flake 的 android-r27d profile 对齐）
  # -------------------------------------------------------------------------
  NDK_VERSION: "27.3.13750724"
  PLATFORM_VERSION: "34"
  BUILD_TOOLS_VERSION: "35.0.0"
  CMAKE_VERSION: "3.22.1"

  # -------------------------------------------------------------------------
  # 改名配置（★ 通常只需要改这一段 ★）
  # -------------------------------------------------------------------------
  # 原生库前缀：lib<前缀>_avcodec.so / lib<前缀>_avformat.so / … / lib<前缀>.so
  REBRAND_NATIVE_PREFIX: "fkit"
  # Java/Kotlin 包名（会同步修改 JNI 符号，工程里的 import 也要跟着改）
  REBRAND_JAVA_PACKAGE: "com.fkit.ffmpegkit"
  # Maven 坐标
  REBRAND_GROUP_ID: "com.fkit"
  REBRAND_ARTIFACT_ID: "ffmpeg-kit"
  # AAR 文件名：<值>-release.aar
  REBRAND_ARCHIVE_NAME: "ffmpeg-kit"
  # 1 = 从 AAR 里删掉 libc++_shared.so（工程中已有同名库时用）
  REBRAND_STRIP_LIBCXX_SHARED: "0"
  # ABI / API
  REBRAND_API_LEVEL: "24"

  # -------------------------------------------------------------------------
  # 构建参数
  #   --arch=arm64-v8a  只编 arm v8
  #   --enable-lib-all  打开全部外部库
  #   --enable-gpl      打开 GPL 库（x264/x265/xvidcore/rubberband/libvidstab）★★ 见 README 许可说明
  #   --disable-lib-gnutls  必须！ffmpeg 的 TLS 后端只能二选一：
  #          --enable-lib-all 会同时打开 gnutls 和 openssl，ffmpeg configure
  #          直接 die「GnuTLS and OpenSSL must not be enabled at the same time.」
  #          这里保留 openssl、关掉 gnutls。反过来关 openssl 不行 ——
  #          scripts/android/srt.sh 硬编码 -DUSE_ENCLIB=openssl -DUSE_OPENSSL_PC=1，
  #          没有 openssl 的 .pc 时 srt 会构建失败。
  #          （gnutls 是叶子库，依赖图里没有别的库依赖它，关掉无副作用。）
  #   --no-archive      不在构建脚本里打 AAR，改名之后再自己打
  #
  #   ★ jobs 说明：标准 ubuntu runner 只有 2 核 / 7GB 内存 / ~14GB 磁盘，
  #     所以这里固定 --jobs=2（匹配核心数，避免 LTO 链接阶段 OOM）。
  #     想更快可以调高，但内存不够时链接会直接挂。
  #   ★ 如果仍然 OOM 或磁盘不足，追加：--no-link-time-optimization
  # -------------------------------------------------------------------------
  BUILD_OPTS: "--arch=arm64-v8a --enable-lib-all --enable-gpl --disable-lib-gnutls --api-level=24 --no-archive --jobs=2"

jobs:
  build:
    name: build arm64-v8a
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        # v6 要求 runner >= 2.327.1（Node 24），GitHub 托管 runner 已满足
        uses: actions/checkout@v6
        with:
          # android.sh 用 `git describe --tags --always` 生成版本号，必须带 tag
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 环境准备
      # ---------------------------------------------------------------------
      - name: Free disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/sources || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
          # 全量外部库（50+ 个）的源码树 + 中间产物相当占地方，
          # 这几个是 runner 上体积大且本次完全用不到的目录。
          # 注意：不能删 /opt/hostedtoolcache 整体 —— JDK 17 就在里面。
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/az /usr/lib/R /opt/microsoft || true
          sudo docker image prune -af || true
          df -h /

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update

          # 逐个探测可安装性，再一次性安装。
          # 原因：不同镜像 / 发行版的软件源里个别包名可能并不存在，
          # 例如 ubuntu-22.04 的 apt 源中就没有名为 which 的独立包
          # （which 命令由 debianutils 提供），
          # 直接整串 apt-get install 会因一个包定位失败而整步 exit 100。
          PKGS="
            build-essential gcc g++ make cmake ninja-build meson
            autoconf automake libtool libtool-bin autopoint m4
            pkg-config bison flex gperf ragel autogen
            nasm yasm
            gettext texinfo groff gawk
            doxygen gtk-doc-tools
            python3 python3-pip perl ruby
            rsync zip unzip wget curl gnupg ca-certificates file patch
            debianutils
            libtasn1-bin libtasn1-6-dev zlib1g-dev patchelf
          "
          # ★ libtasn1-bin 提供 asn1Parser，是 gnutls 的隐式构建依赖。
          #   gnutls 走 git 克隆（含 libtasn1 submodule）方式构建，源码树里
          #   没有预生成的 gnutls_asn1_tab.c / pkix_asn1_tab.c，必须由
          #   asn1Parser 现场从 lib/*.asn 生成；缺它会出现
          #   “WARNING: 'asn1Parser' is missing on your system”
          #   并以 make Error 127 失败（实测踩过）。
          #   上游 flake.nix 的 host 工具清单里也带了 libtasn1。
          INSTALL=""
          SKIPPED=""
          for p in ${PKGS}; do
            if apt-cache show "${p}" >/dev/null 2>&1; then
              INSTALL="${INSTALL} ${p}"
            else
              SKIPPED="${SKIPPED} ${p}"
            fi
          done
          if [ -n "${SKIPPED}" ]; then
            echo "::warning::以下包在当前 apt 源中不存在，已跳过：${SKIPPED}"
          fi
          echo "将安装：${INSTALL}"
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${INSTALL}

          # 关键工具自检：这些是构建与改名脚本真正依赖的，缺任何一个都提前失败。
          # asn1Parser 来自 libtasn1-bin，是 gnutls 编译的隐式依赖，
          # gnutls.sh 里没有任何工具检查，漏装时只会在编译到第 44 个库时
          # 才以 make Error 127 暴露，代价是白跑 20 多分钟，所以在这里兜住。
          MISSING=""
          for t in make cmake ninja meson patchelf nasm yasm autoconf automake \
                   libtoolize autoreconf autogen bison flex gperf ragel \
                   asn1Parser python3 perl pkg-config \
                   gawk patch zip unzip file which; do
            command -v "${t}" >/dev/null 2>&1 || MISSING="${MISSING} ${t}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::关键构建工具缺失：${MISSING}"
            exit 1
          fi
          echo "主机构建依赖就绪"
          # 明确打印 asn1Parser 路径，方便日后排查 gnutls 相关构建问题
          echo "asn1Parser 位置: $(command -v asn1Parser)"

      # ★ JDK 必须 >= 17。android/build.gradle 用的是 AGP 8.13.2，低于 17 会在
      #   工程 evaluate 阶段直接失败：
      #     Failed to apply plugin 'com.android.internal.library'.
      #       > Android Gradle plugin requires Java 17 to run. You are currently using Java 11.
      #   早先这里写的是 ${JAVA_HOME_17_X86_64} 手写探测，但 runner 镜像并不保证
      #   存在这个变量名（预置的可能是 JAVA_HOME_17_X64 之类）；一旦取空，if 分支
      #   静默跳过，本步骤照样显示 success，直到最后打 AAR 那步才以「Java 11」
      #   暴露出来 —— 代价是白跑 30 分钟编译（实测踩过）。
      #   改用官方 action 并提供 JDK，再由下一步做硬校验，彻底杜绝静默失败。
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK >= 17
        run: |
          set -euo pipefail
          V="$(java -version 2>&1 | head -n 1 || true)"
          echo "java: ${V}"
          echo "JAVA_HOME=${JAVA_HOME:-（未设置）}"
          MAJ="$(printf '%s' "${V}" | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p')"
          if [ -z "${MAJ}" ] || [ "${MAJ}" -lt 17 ]; then
            echo "::error::JDK 版本不足 17（${V}）。AGP 8.13.2 要求 Java 17+；若在此放过，只会在最后的 AAR 打包步骤才失败。"
            exit 1
          fi
          echo "JDK 校验通过：主版本 ${MAJ}"

      - name: Set up Android SDK / NDK r27d
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK 目录: $SDK"

          SDKMGR="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::在 $SDK 下找不到 sdkmanager。请把本步骤替换为：uses: android-actions/setup-android@v3"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMGR"

          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"

          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-${PLATFORM_VERSION}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "NDK 版本: $(sed -n 's/^Pkg.Revision[[:space:]]*=[[:space:]]*//p' "$SDK/ndk/${NDK_VERSION}/source.properties")"
          df -h /

      # ---------------------------------------------------------------------
      # 改名 + 构建
      # ---------------------------------------------------------------------
      - name: Apply rebrand to sources
        # 用 bash 显式调用：避免文件可执行位在 Windows 上丢失导致 Permission denied
        run: bash tools/rebrand/rebrand-sources.sh

      - name: Build FFmpegKit (arm64-v8a, all external libraries)
        env:
          EXTRA_OPTS: ${{ inputs.build_opts }}
        run: |
          set -euo pipefail
          OPTS="${EXTRA_OPTS:-${BUILD_OPTS}}"
          echo "构建参数: $OPTS"
          # shellcheck disable=SC2086
          bash ./android.sh $OPTS --package-name="${REBRAND_JAVA_PACKAGE}"

      - name: Rebrand native libraries (.so) and verify
        run: bash tools/rebrand/rebrand-native.sh

      # 编译成果单独留一份（无论后面成功失败）。
      # ndk-build 的产物落在 android/libs/<abi>/，正是 AAR 的 jniLibs 来源，
      # 所以万一 gradle 打包环节出问题，也不用重新烧 30 分钟编译。
      - name: Upload native libraries (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-libs-arm64-v8a-${{ github.run_number }}
          path: |
            android/libs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Package AAR + local Maven repository
        run: bash tools/rebrand/package-aar.sh

      # ---------------------------------------------------------------------
      # 结果
      # ---------------------------------------------------------------------
      - name: Job summary
        if: always()
        run: |
          {
            echo "## FFmpegKitNext Android arm64-v8a (rebranded)"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| FFmpegKit 版本 | $(sed -n 's/.*#define FFMPEG_KIT_VERSION "\([^"]*\)".*/\1/p' android/ffmpeg-kit-next-android-lib/src/main/cpp/ffmpegkit.h | head -1) |"
            echo "| ABI | arm64-v8a |"
            echo "| 动态库前缀 | lib${REBRAND_NATIVE_PREFIX}* |"
            echo "| Java 包名 | ${REBRAND_JAVA_PACKAGE} |"
            echo "| Maven 坐标 | ${REBRAND_GROUP_ID}:${REBRAND_ARTIFACT_ID}:<version> |"
            echo "| 构建参数 | \`${BUILD_OPTS}\` |"
            echo ""
            echo "### 产物"
            echo '```'
            ls -lh out 2>/dev/null || echo "(无产物)"
            echo '```'
            echo ""
            echo "### AAR 内动态库"
            echo '```'
            unzip -l out/*.aar 2>/dev/null | awk '/\.so$/ {print $NF}' || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "===== build.log (tail 800) ====="
          tail -n 800 build.log || true
          echo
          echo "===== build.log 中的 ERROR 行 ====="
          grep -n 'ERROR' build.log | tail -n 60 || true
          echo
          echo "===== 各外部库结果汇总 ====="
          grep -E '^[a-z0-9_-]+: (ok|failed)$' build.log | tail -n 80 || true
          echo
          # ffmpeg 自己的 configure 会把完整命令行与每个检查项写进 ffbuild/config.log。
          # 光看 build.log 只能看到最后那句 die 原因，看不到实际下发的 --enable-* 列表。
          echo "===== src/ffmpeg/ffbuild/config.log 末尾 200 行 ====="
          if [ -f src/ffmpeg/ffbuild/config.log ]; then
            tail -n 200 src/ffmpeg/ffbuild/config.log
          else
            echo "(没有 ffbuild/config.log，说明还没走到 ffmpeg configure)"
          fi

      # 失败时也把 build.log / ffbuild config.log 留一份，便于定位问题（成功时的上传见下一步）
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build.log
            src/ffmpeg/ffbuild/config.log
            src/ffmpeg/configure
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-kit-arm64-v8a-${{ github.run_number }}
          path: |
            out/**
            build.log
          if-no-files-found: error
          retention-days: 30
